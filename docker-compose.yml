services:
  postgres:
    image: postgres:15
    container_name: brisq-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management
    container_name: brisq-rabbitmq
    ports:
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS}
    healthcheck:
      test: ["CMD-SHELL", "rabbitmq-diagnostics -q ping"]
      interval: 5s
      retries: 5
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

  auth:
    build:
      context: .
      dockerfile: auth/Dockerfile
    container_name: brisq-auth
    env_file:
      - path: ./auth/.env.development
        required: true
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      - NODE_ENV=development
    depends_on:
      postgres:
        condition: service_healthy
    develop:
      watch:
        - action: sync
          path: ./auth/src
          target: /app/auth/src
          ignore:
            - node_modules/
        - action: rebuild
          path: ./auth/package.json
        - action: rebuild
          path: ./common/src

  api-gateway:
    build:
      context: .
      dockerfile: api-gateway/Dockerfile
    container_name: brisq-api-gateway
    ports:
      - "3000:3000"
    env_file:
      - path: ./api-gateway/.env.development
        required: true
    environment:
      - NODE_ENV=development
    develop:
      watch:
        - action: sync
          path: ./api-gateway/src
          target: /app/api-gateway/src
          ignore:
            - node_modules/
        - action: rebuild
          path: ./api-gateway/package.json
        - action: rebuild
          path: ./common/src

volumes:
  postgres_data:
    name: brisq_postgres_data
  rabbitmq_data:
    name: brisq_rabbitmq_data
